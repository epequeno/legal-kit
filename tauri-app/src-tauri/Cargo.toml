[package]
name = "legalkit"
version = "0.1.0"
edition = "2021"

[lib]
name = "legalkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "legalkit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }

regex = "1"
once_cell = "1"
anyhow = "1"
thiserror = "1"

# PDF text extraction
pdf-extract = "0.7"

# DOCX (zip + XML)
zip = "2"
quick-xml = { version = "0.36", features = ["serialize"] }

# Flat numeric ops for embeddings
bytemuck = { version = "1", features = ["derive"] }

# Local model inference (BERT embeddings via Metal on Apple Silicon)
# accelerate: Apple Accelerate BLAS for fast CPU matmuls (used by reranker)
candle-core = { version = "0.9", features = ["metal", "accelerate"] }
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[[example]]
name = "test_reranker"

[[example]]
name = "bench_pipeline"
