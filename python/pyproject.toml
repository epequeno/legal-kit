[project]
name = "legalkit"
version = "0.1.0"
description = "Open-source legal AI platform with verifiable citation accuracy"
readme = "README.md"
authors = [
    { name = "Steven Pequeno", email = "steven@pequeno.in" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "anthropic>=0.40",
    "openai>=1.50",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "transformers>=4.45",
    "torch>=2.2",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "sentencepiece>=0.2.1",
    "accelerate>=1.13.0",
    "modal",
    "protobuf>=4.25,<5.0",
    "pymupdf>=1.27.2",
    "python-docx>=1.2.0",
    "datasets>=2.0",
    "sentence-transformers>=5.3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "dspy>=3.1.3",
]

[project.scripts]
legalkit = "legalkit.cli:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "httpx>=0.27",
]
